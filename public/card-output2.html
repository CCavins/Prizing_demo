<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vixi Prize Packs — Prize Board v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Lato', system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(120% 90% at 50% 0%, #223047 0%, #16202f 55%, #0d141f 100%);
    color: #fff;
    height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(60deg, rgba(255,255,255,.018) 25%, transparent 25.5%),
      linear-gradient(-60deg, rgba(255,255,255,.018) 25%, transparent 25.5%),
      linear-gradient(60deg, transparent 74.5%, rgba(0,0,0,.12) 75%),
      linear-gradient(-60deg, transparent 74.5%, rgba(0,0,0,.12) 75%);
    background-size: 140px 242px;
    pointer-events: none;
    z-index: 0;
  }

  .board {
    display: flex;
    align-items: center;
    gap: clamp(14px, 1.8vw, 36px);
    z-index: 2;
    width: 100%;
    max-width: 1780px;
    height: 100%;
    padding: clamp(16px, 3vh, 40px) clamp(24px, 3vw, 56px);
  }

  /* ── Load-in animations: everything staggers in at once ── */
  @keyframes inDown {
    0% { opacity: 0; transform: translateY(-24px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  @keyframes inUp {
    0% { opacity: 0; transform: translateY(28px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  @keyframes inPop {
    0% { opacity: 0; transform: scale(.6); }
    60% { opacity: 1; transform: scale(1.06); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes inGrow {
    0% { opacity: 0; transform: skewX(-18deg) scaleX(0); }
    100% { opacity: 1; transform: skewX(-18deg) scaleX(1); }
  }
  @keyframes rowIn {
    0% { opacity: 0; transform: translateX(-60px); }
    100% { opacity: 1; transform: translateX(0); }
  }

  /* ── Left column: QR + prize inventory ────────────── */
  .side {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(10px, 1.6vh, 18px);
    width: clamp(290px, 23vw, 410px);
    flex-shrink: 0;
    z-index: 2;
  }
  /* QR block stays hidden until the countdown starts */
  .qr-shout {
    font-weight: 900;
    font-size: clamp(22px, 2.4vw, 36px);
    font-style: italic;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #ffb347;
    text-shadow: 0 2px 14px rgba(255,107,74,.35);
    text-align: center;
    line-height: 1.15;
    opacity: 0;
  }
  .side.qr-on .qr-shout { opacity: 1; animation: inDown .5s both; }
  .side.live .qr-shout { opacity: 1; animation: shoutPulse 1s ease-in-out infinite; }
  @keyframes shoutPulse {
    0%, 100% { transform: scale(1) rotate(-2deg); }
    50% { transform: scale(1.1) rotate(2deg); }
  }
  .qr-badge {
    position: relative;
    width: clamp(150px, 14vw, 230px);
    height: clamp(150px, 14vw, 230px);
    background: #fff;
    border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 20px rgba(0,0,0,.35), 0 0 0 clamp(4px, .5vw, 7px) rgba(255,179,71,.9);
    padding: 10px;
    opacity: 0;
  }
  .side.qr-on .qr-badge { opacity: 1; animation: qrSlam .7s .1s cubic-bezier(.17,.67,.29,1.35) both; }
  @keyframes qrSlam {
    0% { opacity: 0; transform: scale(0) rotate(-14deg); }
    55% { opacity: 1; transform: scale(1.15) rotate(3deg); }
    75% { transform: scale(.96) rotate(-1deg); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }
  /* energy rings radiating off the QR once we're live */
  .qr-badge::after {
    content: '';
    position: absolute; inset: -6px;
    border-radius: 22px;
    border: 3px solid rgba(255,179,71,.9);
    opacity: 0;
    pointer-events: none;
  }
  .side.live .qr-badge::after { animation: qrRing 1.6s ease-out infinite; }
  @keyframes qrRing {
    0% { opacity: .9; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.4); }
  }
  .qr-badge canvas, .qr-badge img { display: block; width: 100% !important; height: 100% !important; }
  .qr-sub {
    font-weight: 700;
    font-size: clamp(9px, 1vw, 12px);
    text-transform: uppercase;
    letter-spacing: 3px;
    color: rgba(255,255,255,.55);
    text-align: center;
    opacity: 0;
  }
  .side.qr-on .qr-sub { opacity: 1; animation: inUp .5s .35s both; }
  .mode-pill {
    font-weight: 700;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(255,255,255,.35);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 99px;
    padding: 3px 12px;
    animation: inUp .5s 1.1s both;
  }
  .mode-pill.local { color: #ffb347; border-color: rgba(255,179,71,.4); }

  /* ── Prize rows (compact, under the QR) ───────────── */
  .prizes {
    display: flex;
    flex-direction: column;
    gap: clamp(8px, 1.3vh, 14px);
    width: 100%;
    margin-top: clamp(4px, 1vh, 12px);
  }
  .prize-row {
    display: flex;
    align-items: center;
    gap: clamp(10px, 1vw, 16px);
    background: rgba(255,255,255,.06);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 16px;
    padding: clamp(8px, 1.2vh, 14px) clamp(10px, 1.1vw, 16px);
    position: relative;
    overflow: hidden;
    width: 100%;
  }
  .prize-row:not(.grand) { animation: rowIn .55s both; }
  .prize-row.sold-out { opacity: .5; }
  .prize-row.sold-out::after {
    content: 'ALL CLAIMED';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%) rotate(-10deg);
    font-weight: 900;
    font-size: clamp(11px, 1.2vw, 15px);
    letter-spacing: 2px;
    color: #fff;
    background: rgba(190,45,45,.88);
    padding: 4px 12px;
    border-radius: 6px;
    z-index: 5;
    white-space: nowrap;
  }
  .prize-icon {
    width: clamp(42px, 4.2vw, 60px);
    height: clamp(42px, 4.2vw, 60px);
    border-radius: 12px;
    overflow: hidden;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(26px, 2.8vw, 40px);
    box-shadow: 0 4px 12px rgba(0,0,0,.4);
  }
  .prize-icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .prize-info { flex: 1; min-width: 0; }
  .prize-label {
    font-weight: 900;
    font-size: clamp(11px, 1.1vw, 15px);
    color: #fff;
    line-height: 1.25;
    margin-bottom: 4px;
  }
  .prize-bar-wrap {
    width: 100%;
    height: clamp(6px, .7vw, 9px);
    background: rgba(0,0,0,.3);
    border-radius: 99px;
    overflow: hidden;
  }
  .prize-bar-fill {
    height: 100%;
    border-radius: 99px;
    background: linear-gradient(90deg, #8ec5ff, #fff);
    transition: width .5s cubic-bezier(.22,1,.36,1);
    width: 0%;
  }
  .prize-remaining {
    margin-top: 3px;
    font-weight: 700;
    font-size: clamp(8px, .8vw, 10px);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: rgba(255,255,255,.45);
  }
  .prize-count {
    text-align: center;
    flex-shrink: 0;
    min-width: clamp(40px, 3.6vw, 56px);
  }
  .prize-count .num {
    font-weight: 900;
    font-size: clamp(20px, 2.2vw, 32px);
    line-height: 1;
    display: block;
  }
  .prize-count .of-total {
    font-weight: 700;
    font-size: clamp(9px, 1vw, 12px);
    color: rgba(255,255,255,.45);
  }
  .prize-flash {
    position: absolute; inset: 0;
    background: radial-gradient(circle, rgba(255,255,255,.16) 0%, transparent 70%);
    opacity: 0; pointer-events: none; border-radius: 16px;
    transition: opacity .4s;
  }
  .prize-flash.active { opacity: 1; transition: opacity 0s; }
  @keyframes pop {
    0% { transform: scale(1); }
    40% { transform: scale(1.22); }
    100% { transform: scale(1); }
  }
  .pop { animation: pop .35s cubic-bezier(.17,.67,.29,1.4); }

  /* ── Grand prize row ─────────────────────────────── */
  .prize-row.grand {
    background: linear-gradient(135deg, rgba(255,215,0,.14), rgba(255,120,0,.08));
    border: none;
    transform: scale(0);
    opacity: 0;
    z-index: 1;
  }
  .prize-row.grand::before {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 19px;
    background: conic-gradient(#ffd700, #ffaa00, #ff8c00, #ffd700, #fff8dc, #ffd700, #ffaa00, #ff8c00, #ffd700);
    z-index: -2;
    animation: spinBorder 3s linear infinite;
  }
  .prize-row.grand::after {
    content: '';
    position: absolute;
    inset: 2px;
    border-radius: 14px;
    background: linear-gradient(135deg, #241c10 0%, #17110a 100%);
    z-index: -1;
  }
  @keyframes spinBorder {
    0% { filter: hue-rotate(0deg); }
    100% { filter: hue-rotate(360deg); }
  }
  .prize-row.grand.revealed {
    animation: grandReveal .8s cubic-bezier(.17,.67,.29,1.4) both,
               grandGlow 2s 1s ease-in-out infinite alternate;
  }
  @keyframes grandGlow {
    0% { box-shadow: 0 0 20px rgba(255,215,0,.3), 0 0 60px rgba(255,215,0,.1); }
    100% { box-shadow: 0 0 30px rgba(255,215,0,.5), 0 0 90px rgba(255,215,0,.25); }
  }
  @keyframes grandReveal {
    0% { transform: scale(0) rotate(-5deg); opacity: 0; }
    60% { transform: scale(1.08) rotate(1deg); opacity: 1; }
    80% { transform: scale(0.97) rotate(0deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }
  .prize-row.grand .prize-label {
    background: linear-gradient(90deg, #ffd700, #ffaa00);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    font-size: clamp(12px, 1.2vw, 16px);
  }
  .prize-row.grand .prize-bar-fill { background: linear-gradient(90deg, #ffd700, #ffaa00); }
  .prize-row.grand .prize-count .num { color: #ffd700; }
  .prize-row.grand .prize-icon { animation: grandPulse 2s ease-in-out infinite; }
  @keyframes grandPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }
  .grand-flash {
    position: fixed; inset: 0;
    z-index: 200;
    background: radial-gradient(circle, rgba(255,215,0,.4) 0%, rgba(255,215,0,0) 70%);
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s;
  }
  .grand-flash.active { opacity: 1; transition: opacity 0s; }

  /* ── Admin cog (bottom-right) ─────────────────────── */
  .admin-cog {
    position: fixed;
    right: 18px; bottom: 16px;
    z-index: 500;
    width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    color: rgba(255,255,255,.3);
    text-decoration: none;
    transition: color .25s, transform .4s ease;
  }
  .admin-cog svg { width: 24px; height: 24px; display: block; }
  .admin-cog:hover {
    color: #ffb347;
    transform: rotate(90deg);
  }

  /* ── Main column: logo lockup + card stage + stats ── */
  .main {
    flex: 1;
    min-width: 0;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .hero-kicker {
    font-weight: 700;
    font-size: clamp(13px, 1.5vw, 22px);
    text-transform: uppercase;
    letter-spacing: clamp(6px, .9vw, 14px);
    text-indent: clamp(6px, .9vw, 14px);
    color: rgba(255,255,255,.7);
    margin-bottom: clamp(2px, .6vh, 8px);
    animation: inDown .6s .1s both;
    white-space: nowrap;
  }
  .hero-logo {
    position: relative;
    font-weight: 900;
    font-style: italic;
    font-size: clamp(56px, 8.2vw, 148px);
    text-transform: uppercase;
    letter-spacing: .02em;
    line-height: 1;
    background: linear-gradient(170deg, #ffffff 6%, #cfd8e6 30%, #8fa0b6 47%, #f2f6fc 54%, #6e7f96 80%, #dbe4f0);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 5px 5px rgba(0,0,0,.55)) drop-shadow(0 0 40px rgba(255,179,71,.22));
    animation: inPop .7s .2s both;
    white-space: nowrap;
  }
  .hero-logo-bar {
    width: clamp(240px, 26vw, 460px);
    height: clamp(4px, .5vw, 8px);
    margin-top: clamp(4px, .8vh, 10px);
    border-radius: 99px;
    background: linear-gradient(90deg, transparent, #ffb347 20%, #ff6b4a 80%, transparent);
    animation: inGrow .5s .5s both;
  }

  /* ── Card stage: pack → fan sequence ──────────────── */
  .stage {
    position: relative;
    width: clamp(420px, 44vw, 800px);
    height: clamp(280px, 40vh, 520px);
    margin-top: clamp(14px, 3.2vh, 40px);
    flex-shrink: 1;
    animation: inUp .6s .35s both;
  }
  .stage .tcard {
    position: absolute;
    left: 50%; top: 50%;
    --cardw: clamp(160px, 15vw, 280px);
    transform-origin: 50% 120%;
    box-shadow: 0 20px 50px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.08);
    transform: translate(-50%, -58%) translateY(10%) scale(.55);
    opacity: 0;
    will-change: transform, opacity;
  }
  /* extra shimmer sweep during the hover beat */
  .stage.shimmer .tcard::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.32) 48%, rgba(255,255,255,.55) 50%, rgba(255,255,255,.32) 52%, transparent 70%);
    background-size: 250% 250%;
    animation: stageShimmer 1.1s ease-in-out both;
    pointer-events: none;
    z-index: 20;
  }
  @keyframes stageShimmer {
    0% { background-position: 120% 120%; }
    100% { background-position: -30% -30%; }
  }

  /* Board pack (silver foil, matches the phone pack) */
  .spack {
    position: absolute;
    left: 50%; top: 50%;
    --packw: clamp(175px, 16.5vw, 290px);
    width: var(--packw);
    aspect-ratio: 5 / 7.2;
    transform: translate(-50%, -55%);
    z-index: 30;
    will-change: transform, opacity;
  }
  .spack.fly-in { animation: spackIn .8s cubic-bezier(.2,.8,.3,1.1) both; }
  @keyframes spackIn {
    0% { transform: translate(-50%, -55%) translate(-55vw, 30vh) rotate(-32deg) scale(.55); opacity: 0; }
    30% { opacity: 1; }
    100% { transform: translate(-50%, -55%) rotate(0deg) scale(1); opacity: 1; }
  }
  .spack-top {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 14%;
    border-radius: 12px 12px 0 0;
    background: linear-gradient(115deg, #b9c2cf 0%, #eef2f7 18%, #8f9aa9 34%, #dde4ec 50%, #98a3b3 66%, #f2f5f9 82%, #aab4c2 100%);
    clip-path: polygon(0 0, 100% 0, 100% 78%, 94% 92%, 88% 76%, 81% 94%, 74% 78%, 67% 93%, 60% 77%, 53% 92%, 46% 76%, 39% 94%, 32% 78%, 25% 92%, 18% 76%, 11% 93%, 5% 78%, 0 90%);
    z-index: 3;
  }
  .spack-top::before {
    content: '';
    position: absolute;
    top: 10%; left: 0; right: 0; height: 46%;
    background: repeating-linear-gradient(90deg, rgba(0,0,0,.14) 0 2px, transparent 2px 8px);
  }
  .spack.open .spack-top {
    transition: transform .55s cubic-bezier(.3,.6,.3,1), opacity .55s;
    transform: translate(-130%, -150%) rotate(-38deg);
    opacity: 0;
  }
  .spack-body {
    position: absolute;
    top: 11%; left: 0; right: 0; bottom: 0;
    border-radius: 0 0 12px 12px;
    overflow: hidden;
    background: linear-gradient(115deg, #b9c2cf 0%, #eef2f7 18%, #8f9aa9 34%, #dde4ec 50%, #98a3b3 66%, #f2f5f9 82%, #aab4c2 100%);
    clip-path: polygon(0 2%, 5% 0.5%, 11% 2.5%, 18% 0.8%, 25% 2.6%, 32% 0.9%, 39% 2.7%, 46% 0.8%, 53% 2.5%, 60% 0.9%, 67% 2.6%, 74% 0.9%, 81% 2.7%, 88% 0.8%, 94% 2.4%, 100% 1%, 100% 100%, 0 100%);
    box-shadow: 0 14px 40px rgba(0,0,0,.55), inset 0 0 30px rgba(0,0,0,.18);
    z-index: 2;
  }
  .spack.open .spack-body {
    transition: transform .6s .25s ease, opacity .6s .25s ease;
    transform: translateY(110%) rotate(5deg);
    opacity: 0;
  }
  .sp-facets {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(60deg, rgba(255,255,255,.30) 25%, transparent 25.5%),
      linear-gradient(-60deg, rgba(255,255,255,.30) 25%, transparent 25.5%),
      linear-gradient(60deg, transparent 74.5%, rgba(20,30,45,.10) 75%),
      linear-gradient(-60deg, transparent 74.5%, rgba(20,30,45,.10) 75%);
    background-size: 36% 30%;
  }
  .sp-frame {
    position: absolute;
    top: 15%; left: 7%; right: 7%; bottom: 10%;
    background: linear-gradient(160deg, #33415a, #0e1626 40%, #3c4c68 60%, #101a2a);
    clip-path: polygon(10% 0, 90% 0, 100% 5%, 100% 100%, 0 100%, 0 5%);
  }
  .sp-frame-inner {
    position: absolute;
    top: calc(15% + 2px); left: calc(7% + 2px); right: calc(7% + 2px); bottom: calc(10% + 2px);
    background: linear-gradient(115deg, #9aa5b4 0%, #ccd4de 30%, #8f9aa9 55%, #c4ccd8 80%, #a6b0bf 100%);
    clip-path: polygon(10% 0, 90% 0, 100% 5%, 100% 100%, 0 100%, 0 5%);
  }
  .sp-brand {
    position: absolute;
    top: 6.5%; left: 0; right: 0;
    text-align: center;
    font-weight: 900;
    font-size: calc(var(--packw) * .05);
    letter-spacing: .5em;
    text-indent: .5em;
    color: rgba(20,30,45,.75);
    z-index: 4;
  }
  .sp-logo {
    position: absolute;
    top: 16.5%; left: 0; right: 0;
    text-align: center;
    font-weight: 900;
    font-style: italic;
    font-size: calc(var(--packw) * .115);
    letter-spacing: .05em;
    line-height: 1;
    background: linear-gradient(170deg, #33415a 8%, #0e1626 38%, #3c4c68 52%, #0a1120 78%, #2c3a52);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 1px 1px rgba(255,255,255,.6));
    z-index: 4;
  }
  .sp-art {
    position: absolute;
    top: 28%; left: 12%; right: 12%; bottom: 13%;
    background-size: cover;
    background-position: center 20%;
    -webkit-mask-image: linear-gradient(to top, transparent 0%, #000 16%, #000 100%);
    mask-image: linear-gradient(to top, transparent 0%, #000 16%, #000 100%);
    z-index: 3;
  }
  .sp-crimp {
    position: absolute;
    bottom: 0; left: 0; right: 0; height: 5.5%;
    border-radius: 0 0 12px 12px;
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,.18) 0 2px, transparent 2px 8px),
      linear-gradient(115deg, #9aa5b4, #e8edf4 30%, #8f9aa9 55%, #dde4ec 80%, #a6b0bf);
    z-index: 5;
  }
  .sp-sheen {
    position: absolute; inset: 0;
    z-index: 6;
    pointer-events: none;
    background:
      radial-gradient(130% 55% at 50% 34%, rgba(255,255,255,.18), transparent 62%),
      linear-gradient(90deg, rgba(0,0,0,.30) 0%, transparent 9%, transparent 91%, rgba(0,0,0,.30) 100%);
  }
  .sp-sheen::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(105deg, transparent 42%, rgba(255,255,255,.45) 50%, transparent 58%);
    background-size: 250% 100%;
    animation: spSweep 2.8s ease-in-out infinite;
  }
  @keyframes spSweep {
    0%, 100% { background-position: 120% 0; }
    50% { background-position: -20% 0; }
  }

  /* ── Stat boxes: packs · TIMER · claimed ──────────── */
  .stat-row {
    margin-top: clamp(8px, 1.6vh, 20px);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(20px, 3vw, 56px);
    width: 100%;
  }
  .stat-box {
    background: rgba(13,20,31,.72);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 16px;
    padding: clamp(10px, 1.4vh, 16px) clamp(18px, 2vw, 32px);
    text-align: center;
  }
  .stat-box:nth-child(1) { animation: inUp .55s .6s both; }
  .stat-box:nth-child(2) { animation: inUp .55s .7s both; }
  .stat-box:nth-child(3) { animation: inUp .55s .8s both; }
  .stat-label {
    font-weight: 700;
    font-size: clamp(9px, .95vw, 12px);
    text-transform: uppercase;
    letter-spacing: 3px;
    color: rgba(255,255,255,.5);
    margin-bottom: 4px;
    white-space: nowrap;
  }
  .stat-value {
    font-weight: 900;
    font-size: clamp(24px, 2.8vw, 40px);
    line-height: 1;
    color: #fff;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .stat-box.timer {
    padding: clamp(8px, 1.2vh, 14px) clamp(24px, 2.6vw, 44px);
    border-color: rgba(255,179,71,.35);
  }
  .stat-box.timer .stat-value {
    font-size: clamp(42px, 5vw, 80px);
    color: #ffb347;
    text-shadow: 0 2px 16px rgba(255,179,71,.3);
  }
  .stat-box.timer .stat-value.hot { color: #ff6b4a; animation: hotPulse .8s ease-in-out infinite; }
  .stat-box.timer .stat-value.done { color: #ff9c9c; }
  .stat-value .cs { font-size: .6em; opacity: .8; }
  @keyframes hotPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }
  .stat-value.hot { color: #ff6b4a; animation: hotPulse 1s ease-in-out infinite; }
  /* countdown flash: 5·4·3·2·1·GO! pulsing inside the timer box */
  .stat-box.timer .stat-value.flash { animation: countFlash .65s cubic-bezier(.17,.67,.29,1.2) both; }
  @keyframes countFlash {
    0% { opacity: 0; transform: scale(2.2); }
    35% { opacity: 1; transform: scale(1); }
    100% { opacity: 1; transform: scale(1); }
  }
  .stat-box.timer .stat-value.goword {
    background: linear-gradient(170deg, #fff3c4 5%, #ffb347 40%, #ff6b4a 70%, #ffd28a);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: none;
    filter: drop-shadow(0 0 24px rgba(255,140,60,.6));
  }
  .stat-bar {
    width: clamp(110px, 10vw, 170px);
    height: 7px;
    margin: 7px auto 0;
    background: rgba(0,0,0,.35);
    border-radius: 99px;
    overflow: hidden;
  }
  .stat-bar-fill {
    height: 100%;
    width: 100%;
    border-radius: 99px;
    background: linear-gradient(90deg, #ffb347, #ff6b4a);
    transition: width .5s cubic-bezier(.22,1,.36,1);
  }

</style>
</head>
<body>

<div class="grand-flash" id="grandFlash"></div>

<a class="admin-cog" href="card-admin.html" target="_blank" title="Admin settings" aria-label="Admin settings">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="3"></circle>
    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
  </svg>
</a>

<div class="board">
  <div class="side" id="sideCol">
    <div class="qr-shout">Scan Now!!</div>
    <div class="qr-badge" id="qrBadge"></div>
    <div class="qr-sub">Rip a pack on your phone</div>
    <div class="prizes" id="prizes"></div>
    <div class="mode-pill" id="modePill">connecting…</div>
  </div>

  <div class="main">
    <div class="hero-kicker">Exclusive Digital Collectables</div>
    <div class="hero-logo">Prize Packs</div>
    <div class="hero-logo-bar"></div>
    <div class="stage" id="stage"></div>
    <div class="stat-row">
      <div class="stat-box">
        <div class="stat-label">Packs Collected</div>
        <div class="stat-value" id="scansNum">0</div>
      </div>
      <div class="stat-box timer">
        <div class="stat-label" id="timerLabel">Get Ready</div>
        <div class="stat-value" id="timerNum">00:<span class="cs">00</span></div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Prizes Claimed</div>
        <div class="stat-value" id="tickerNum">0 / 0</div>
        <div class="stat-bar"><div class="stat-bar-fill" id="dropBarFill"></div></div>
      </div>
    </div>
  </div>
</div>

<script src="cards-sync.js"></script>
<script src="cards-deck.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
  new QRCode(document.getElementById('qrBadge'), {
    text: new URL('card-player.html', location.href).href,
    width: 200, height: 200,
    colorDark: '#000', colorLight: '#fff',
    correctLevel: QRCode.CorrectLevel.H
  });
</script>
<script>
(function () {
  const S = CardsSync;
  const prizesEl = document.getElementById('prizes');
  const tickerNum = document.getElementById('tickerNum');
  const dropBarFill = document.getElementById('dropBarFill');
  const grandFlash = document.getElementById('grandFlash');
  const modePill = document.getElementById('modePill');
  const sideCol = document.getElementById('sideCol');

  const GRAND_REVEAL_AT_MS = 15000; // grand prize appears 15s into the round

  /* ═══ Card stage: pack → reveal → fan (loops once live) ═══ */
  const stage = document.getElementById('stage');
  const FAN_ANGLES = [-24, -12, 0, 12, 24];
  const FAN_RARITIES = ['silver', 'base', 'prism', 'gold', 'base'];
  let cycleToken = 0;
  let currentFan = [];

  function buildStagePack() {
    const pack = document.createElement('div');
    pack.className = 'spack';
    const art = CardsDeck.PLAYERS[Math.floor(Math.random() * CardsDeck.PLAYERS.length)].img;
    pack.innerHTML =
      '<div class="spack-top"></div>' +
      '<div class="spack-body">' +
        '<div class="sp-facets"></div>' +
        '<div class="sp-frame"></div>' +
        '<div class="sp-frame-inner"></div>' +
        '<div class="sp-brand">VIXI</div>' +
        '<div class="sp-logo">Prize Packs</div>' +
        '<div class="sp-art" style="background-image:url(\'' + art + '\')"></div>' +
        '<div class="sp-crimp"></div>' +
        '<div class="sp-sheen"></div>' +
      '</div>';
    return pack;
  }

  // One full pack-open sequence. loop=false (intro): cards land and just
  // hover — no fly-off, no next cycle until the round goes live.
  function stageCycle(loop) {
    const token = ++cycleToken;
    const alive = () => token === cycleToken;

    stage.classList.remove('shimmer');
    stage.innerHTML = '';

    // fresh set of cards, hidden at center behind the pack
    const cardEls = FAN_ANGLES.map((angle, i) => {
      const data = CardsDeck.randomPlayerCard();
      data.rarity = FAN_RARITIES[i];
      const el = CardsDeck.renderCard(data);
      el.style.zIndex = i === 2 ? 10 : 10 - Math.abs(i - 2);
      stage.appendChild(el);
      return el;
    });
    currentFan = cardEls;

    // pack flies in on top
    const pack = buildStagePack();
    pack.classList.add('fly-in');
    stage.appendChild(pack);

    // t≈1500ms: tear the pack open
    setTimeout(() => {
      if (!alive()) return;
      pack.classList.add('open');
    }, 1500);

    // t≈1750ms: center card pops up out of the pack
    setTimeout(() => {
      if (!alive()) return;
      const center = cardEls[2];
      center.style.transition = 'transform .5s cubic-bezier(.2,.8,.3,1.1), opacity .3s';
      center.style.opacity = '1';
      center.style.transform = 'translate(-50%, -58%) scale(1)';
    }, 1750);

    // t≈2350ms: the other four fan out left and right, staggered
    setTimeout(() => {
      if (!alive()) return;
      const order = [1, 3, 0, 4]; // inner pair first, then outer
      order.forEach((idx, k) => {
        setTimeout(() => {
          if (!alive()) return;
          const el = cardEls[idx];
          el.style.transition = 'transform .5s cubic-bezier(.2,.8,.3,1.1), opacity .3s';
          el.style.opacity = '1';
          el.style.transform = 'translate(-50%, -58%) rotate(' + FAN_ANGLES[idx] + 'deg)';
        }, k * 110);
      });
    }, 2350);

    // t≈3100ms: pack is gone; shimmer + hover beat
    setTimeout(() => {
      if (!alive()) return;
      pack.remove();
      stage.classList.add('shimmer');
      cardEls.forEach((el, i) => {
        el.style.transition = 'transform 1.6s ease-in-out';
        el.style.transform = 'translate(-50%, -60.5%) rotate(' + FAN_ANGLES[i] + 'deg)';
      });
    }, 3100);

    if (!loop) return; // intro: hold the fan until GO!

    // t≈4900ms: cards fly off with a stagger, each on its own path
    setTimeout(() => {
      if (!alive()) return;
      flyOffFan();
    }, 4900);

    // t≈6000ms: next set
    setTimeout(() => { if (alive()) stageCycle(true); }, 6000);
  }

  function flyOffFan() {
    currentFan.forEach((el, i) => {
      setTimeout(() => {
        const dx = (i - 2) * 190;
        el.style.transition = 'transform .6s cubic-bezier(.5,0,.8,.4), opacity .25s .35s';
        el.style.transform =
          'translate(-50%, -58%) translate(' + dx + 'px, -560px) rotate(' + ((i - 2) * 32) + 'deg) scale(.85)';
        el.style.opacity = '0';
      }, i * 90);
    });
  }

  /* ═══ Round timer: SS:cs — countdown flashes in the same box ═══ */
  const timerNum = document.getElementById('timerNum');
  const timerLabel = document.getElementById('timerLabel');
  let roundEndsAt = 0;
  let timerRunning = false;

  function roundSecs() { return Math.max(10, Number(S.config.drainSecs) || 60); }
  function roundActive() { return roundEndsAt > 0 && Date.now() < roundEndsAt; }

  function fmtTimer(ms) {
    const ss = Math.floor(ms / 1000);
    const cs = Math.floor((ms % 1000) / 10);
    return String(ss).padStart(2, '0') + ':<span class="cs">' + String(cs).padStart(2, '0') + '</span>';
  }
  timerNum.innerHTML = fmtTimer(roundSecs() * 1000);

  function tickTimer() {
    if (!timerRunning) return;
    const left = Math.max(0, roundEndsAt - Date.now());
    timerNum.innerHTML = fmtTimer(left);
    timerNum.classList.toggle('hot', left > 0 && left <= 10000);
    if (left <= 0) {
      timerNum.classList.remove('hot');
      timerNum.classList.add('done');
      timerLabel.textContent = "Time's Up";
    }
    requestAnimationFrame(tickTimer);
  }

  /* ═══ Fake "packs collected" counter (starts at GO) ═══ */
  const scansEl = document.getElementById('scansNum');
  let scansCurrent = 0;
  const SCANS_MAX = 4217;
  function stepScans() {
    if (scansCurrent >= SCANS_MAX) return;
    const remaining = SCANS_MAX - scansCurrent;
    const jump = Math.max(2, Math.round(remaining * (0.03 + Math.random() * 0.08)));
    scansCurrent = Math.min(scansCurrent + jump, SCANS_MAX);
    scansEl.textContent = scansCurrent.toLocaleString();
    if (scansCurrent < SCANS_MAX) setTimeout(stepScans, 1000 + Math.random() * 2000);
  }

  /* ═══ Prize rows ═══ */
  function buildRow(p, isGrand, index) {
    const row = document.createElement('div');
    row.className = 'prize-row' + (isGrand ? ' grand' : '');
    row.id = 'row-' + p.id;
    if (!isGrand) row.style.animationDelay = (0.45 + index * 0.14) + 's';
    const iconHtml = p.img ? '<img src="' + p.img + '" alt="">' : p.icon;
    row.innerHTML =
      '<div class="prize-flash" id="flash-' + p.id + '"></div>' +
      '<div class="prize-icon">' + iconHtml + '</div>' +
      '<div class="prize-info">' +
        '<div class="prize-label">' + p.label + '</div>' +
        '<div class="prize-bar-wrap"><div class="prize-bar-fill" id="bar-' + p.id + '"></div></div>' +
        '<div class="prize-remaining" id="rem-' + p.id + '"></div>' +
      '</div>' +
      '<div class="prize-count">' +
        '<span class="num" id="count-' + p.id + '">0</span>' +
        '<span class="of-total" id="total-' + p.id + '">/ 0</span>' +
      '</div>';
    prizesEl.appendChild(row);
    return row;
  }
  S.BASE_PRIZES.forEach((p, i) => buildRow(p, false, i));
  const grandRow = buildRow(S.GRAND, true, 0);

  let grandShown = false;

  function updateUI() {
    S.ALL_PRIZES.forEach(p => {
      const total = S.prizeTotal(p.id);
      const claimed = Math.min(S.prizeClaimed(p.id), total);
      const pct = total > 0 ? Math.min(100, (claimed / total) * 100) : 0;
      document.getElementById('count-' + p.id).textContent = claimed;
      document.getElementById('total-' + p.id).textContent = '/ ' + total;
      document.getElementById('bar-' + p.id).style.width = pct + '%';
      const rem = total - claimed;
      document.getElementById('rem-' + p.id).textContent = rem > 0 ? rem + ' remaining' : 'None remaining';
      const rowEl = document.getElementById('row-' + p.id);
      if (rem <= 0 && p.id !== S.GRAND.id) rowEl.classList.add('sold-out');
      else rowEl.classList.remove('sold-out');
    });

    const baseTotal = S.baseTotal();
    const baseClaimed = S.baseClaimed();
    tickerNum.textContent = baseClaimed + ' / ' + baseTotal;
    const remPct = baseTotal > 0 ? Math.max(0, 1 - baseClaimed / baseTotal) : 1;
    dropBarFill.style.width = (remPct * 100) + '%';
    tickerNum.classList.toggle('hot', remPct <= 0.35 && remPct > 0);

    if (S.state.grandRevealed && !grandShown) revealGrandRow();
    if (!S.state.grandRevealed && grandShown) hideGrandRow();
  }

  function animateIncrement(prizeId) {
    const countEl = document.getElementById('count-' + prizeId);
    if (!countEl) return;
    countEl.classList.remove('pop');
    void countEl.offsetWidth;
    countEl.classList.add('pop');
    const flash = document.getElementById('flash-' + prizeId);
    if (flash) {
      flash.classList.add('active');
      setTimeout(() => flash.classList.remove('active'), 400);
    }
  }

  function revealGrandRow() {
    grandShown = true;
    grandFlash.classList.add('active');
    setTimeout(() => grandFlash.classList.remove('active'), 600);
    setTimeout(() => grandRow.classList.add('revealed'), 400);
  }

  function hideGrandRow() {
    grandShown = false;
    grandRow.classList.remove('revealed');
  }

  /* ═══ Intro: everything staggers in, then 5·4·3·2·1·GO! flashes
     in the timer box — no full-screen overlay ═══ */
  function flashCount(text, isGo) {
    timerNum.textContent = text;
    timerNum.classList.toggle('goword', !!isGo);
    timerNum.classList.remove('flash');
    void timerNum.offsetWidth;
    timerNum.classList.add('flash');
  }

  function runIntro() {
    // load-in stagger (CSS) plays while the intro pack opens on stage.
    stageCycle(false);
    // Countdown waits until the first pack has opened and the fan is
    // holding (pack gone + cards settled ≈ 4.7s into the cycle).
    setTimeout(() => {
      sideCol.classList.add('qr-on'); // QR slams in as the countdown starts
      timerLabel.textContent = 'Get Ready';
      let n = 5;
      const step = () => {
        if (n > 0) {
          flashCount(String(n), false);
          n--;
          setTimeout(step, 1100);
        } else {
          flashCount('GO!', true);
          setTimeout(goLive, 900);
        }
      };
      step();
    }, 4700);
  }

  function goLive() {
    timerNum.classList.remove('flash', 'goword');

    // QR gets its energy: pulsing shout + radiating rings
    sideCol.classList.add('live');

    // round begins: timer, drain, packs counter, grand at 15s
    roundEndsAt = Date.now() + roundSecs() * 1000;
    timerRunning = true;
    timerLabel.textContent = 'Time Remaining';
    requestAnimationFrame(tickTimer);
    startDemoDrain();
    stepScans();
    setTimeout(() => { if (!S.state.grandRevealed) S._setGrandRevealed(); }, GRAND_REVEAL_AT_MS);

    // clear the intro fan, then start the repeating pack loop
    flyOffFan();
    setTimeout(() => stageCycle(true), 900);
  }

  /* ═══ Sync wiring ═══ */
  S.ready.then(() => {
    modePill.textContent = S.mode === 'firebase' ? 'live sync' : 'local mode';
    modePill.classList.toggle('local', S.mode !== 'firebase');
    // No admin buttons on this board: every page load is a fresh game —
    // claims are cleared, the grand prize re-hides, the intro replays.
    S.resetGame();
    updateUI();
    runIntro();
  });

  S.onChange(updateUI);

  S.onClaim((evt) => {
    animateIncrement(evt.prize);
  });

  /* ═══ Demo drain — gated on the local round timer ═══ */
  let drainTimer = null;
  let grandDemoScheduled = false;

  function startDemoDrain() {
    if (drainTimer) clearTimeout(drainTimer);
    grandDemoScheduled = false;
    scheduleDrainTick();
  }

  function scheduleDrainTick() {
    const totalStock = S.baseTotal();
    const avgMs = totalStock > 0 ? (roundSecs() * 1000) / totalStock : 1000;
    const next = avgMs * (0.5 + Math.random());
    drainTimer = setTimeout(drainTick, next);
  }

  function drainTick() {
    if (!S.config.demoDrain || !roundActive()) { drainTimer = setTimeout(drainTick, 1500); return; }

    const candidates = S.BASE_PRIZES.filter(p => S.prizeRemaining(p.id) > 0);
    if (candidates.length > 0) {
      const totalW = candidates.reduce((s, p) => s + p.weight, 0);
      let r = Math.random() * totalW;
      let pick = candidates[0];
      for (const p of candidates) { r -= p.weight; if (r <= 0) { pick = p; break; } }
      S.claim(pick.id, 'DEMO');
    }

    if (S.state.grandRevealed && !grandDemoScheduled && S.prizeRemaining(S.GRAND.id) > 0) {
      grandDemoScheduled = true;
      setTimeout(() => {
        if (S.config.demoDrain && S.prizeRemaining(S.GRAND.id) > 0) S.claim(S.GRAND.id, 'DEMO');
      }, 3000 + Math.random() * 4000);
    }

    scheduleDrainTick();
  }
})();
</script>
